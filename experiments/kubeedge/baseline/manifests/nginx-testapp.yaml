apiVersion: v1
kind: Namespace
metadata:
  name: testapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-testapp
  namespace: testapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-testapp
  template:
    metadata:
      labels:
        app: nginx-testapp
    spec:
      nodeSelector:
        node-role.kubernetes.io/edge: ""
      containers:
        - name: nginx
          image: nginx:stable
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-testapp
  namespace: testapp
spec:
  type: NodePort
  selector:
    app: nginx-testapp
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
